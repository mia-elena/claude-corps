<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riverbend Volunteer Shift Signup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: #2d3748;
      color: white;
      padding: 32px;
      text-align: center;
    }
    .header h1 { font-size: 26px; margin-bottom: 8px; }
    .header p { opacity: 0.8; font-size: 14px; }
    .notice {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      font-size: 13px;
      color: #78350f;
    }
    .shifts { padding: 28px 32px; }
    .shifts h2 { font-size: 15px; color: #4a5568; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }
    .shift-card {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .shift-card:hover { border-color: #667eea; transform: translateY(-1px); }
    .shift-card.full { background: #f8fafc; opacity: 0.7; }
    .shift-info h3 { font-size: 17px; color: #2d3748; margin-bottom: 2px; }
    .shift-info .location { color: #718096; font-size: 14px; }
    .badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .badge-spots { background: #edf2f7; color: #4a5568; }
    .badge-age { background: #fef3c7; color: #92400e; }
    .signup-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .signup-btn:hover { background: #5a67d8; }
    .signup-btn:disabled { background: #cbd5e0; cursor: not-allowed; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 90%;
      max-width: 420px;
    }
    .modal-content h2 { margin-bottom: 4px; font-size: 19px; color: #2d3748; }
    .modal-sub { font-size: 13px; color: #718096; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 4px; }
    .modal-content input[type="text"],
    .modal-content input[type="email"],
    .modal-content input[type="tel"] {
      width: 100%;
      padding: 11px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    .modal-content input:focus { outline: none; border-color: #667eea; }
    .age-gate {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #78350f;
    }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 18px;
    }
    .checkbox-row input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .checkbox-row span { font-size: 13px; color: #4a5568; line-height: 1.5; }
    .modal-actions { display: flex; gap: 12px; }
    .cancel-btn {
      flex: 1;
      background: #edf2f7;
      color: #4a5568;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .cancel-btn:hover { background: #e2e8f0; }
    .err { color: #e53e3e; font-size: 13px; margin-bottom: 12px; }
    .confirm-screen { text-align: center; padding: 8px 0; }
    .confirm-screen .check { font-size: 48px; margin-bottom: 12px; color: #276749; }
    .confirm-screen h2 { color: #276749; margin-bottom: 10px; }
    .confirm-screen p { font-size: 14px; color: #4a5568; line-height: 1.7; }
    .proto-note {
      font-size: 12px;
      color: #a0aec0;
      border-top: 1px solid #e2e8f0;
      margin-top: 16px;
      padding-top: 12px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Riverbend Volunteer Shifts</h1>
    <p>Pick a shift and we'll confirm your spot by text.</p>
  </div>
  <div class="notice">
    All volunteers sign a one-page liability waiver on arrival at their first shift — no pre-sign required.
  </div>
  <div class="shifts">
    <h2>Available Shifts</h2>
    <div id="shifts"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-body">
    <!-- populated by openModal() -->
  </div>
</div>

<script>
  const shifts = [
    { id: 1, day: "Tuesday",  time: "9am – 12pm", location: "Warehouse sort",                   need: 8,  taken: 3, mobile: false },
    { id: 2, day: "Tuesday",  time: "1pm – 4pm",  location: "Warehouse sort",                   need: 6,  taken: 6, mobile: false },
    { id: 3, day: "Thursday", time: "9am – 12pm", location: "Warehouse sort",                   need: 8,  taken: 1, mobile: false },
    { id: 4, day: "Saturday", time: "8am – 11am", location: "Mobile pantry — Ellis (18+ only)", need: 12, taken: 5, mobile: true  },
    { id: 5, day: "Saturday", time: "9am – 1pm",  location: "Warehouse public drop-off",        need: 4,  taken: 2, mobile: false },
  ];

  let selectedShift = null;

  function render() {
    document.getElementById('shifts').innerHTML = shifts.map(s => {
      const open = s.need - s.taken;
      const full = open <= 0;
      return `
        <div class="shift-card${full ? ' full' : ''}">
          <div class="shift-info">
            <h3>${s.day} &middot; ${s.time}</h3>
            <div class="location">${s.location}</div>
            <div class="badges">
              <span class="badge badge-spots">${full ? 'Full' : `${open} of ${s.need} spots open`}</span>
              ${s.mobile ? '<span class="badge badge-age">18+ required</span>' : ''}
            </div>
          </div>
          <button class="signup-btn" ${full ? 'disabled' : ''} onclick="openModal(${s.id})">
            ${full ? 'Full' : 'Sign up'}
          </button>
        </div>`;
    }).join('');
  }

  function openModal(id) {
    selectedShift = shifts.find(s => s.id === id);
    document.getElementById('modal-body').innerHTML = `
      <h2>${selectedShift.day} &middot; ${selectedShift.time}</h2>
      <p class="modal-sub">${selectedShift.location}</p>
      ${selectedShift.mobile ? `
        <div class="age-gate">
          This shift is on a mobile pantry route. Volunteers must be <strong>18 or older</strong> (insurance requirement).
        </div>` : ''}
      <div id="err-msg" class="err" style="display:none;"></div>
      <label for="f-name">Full name</label>
      <input type="text" id="f-name" placeholder="Your name" autocomplete="name">
      <label for="f-email">Email</label>
      <input type="email" id="f-email" placeholder="your@email.com" autocomplete="email">
      <label for="f-phone">Phone (for reminder text)</label>
      <input type="tel" id="f-phone" placeholder="(555) 000-0000" autocomplete="tel">
      <div class="checkbox-row">
        <input type="checkbox" id="waiver-check">
        <span>I understand I will sign a <strong>liability waiver</strong> on arrival at my first shift.</span>
      </div>
      ${selectedShift.mobile ? `
        <div class="checkbox-row">
          <input type="checkbox" id="age-check">
          <span>I confirm I am <strong>18 years of age or older</strong>.</span>
        </div>` : ''}
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="signup-btn" onclick="submitSignup()">Confirm my spot</button>
      </div>
      <p class="proto-note">Prototype: submission data is not yet saved to a backend. Airtable integration coming.</p>
    `;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function showError(msg) {
    const el = document.getElementById('err-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function submitSignup() {
    const name   = document.getElementById('f-name').value.trim();
    const email  = document.getElementById('f-email').value.trim();
    const phone  = document.getElementById('f-phone').value.trim();
    const waiver = document.getElementById('waiver-check').checked;
    const ageEl  = document.getElementById('age-check');
    const ageOk  = !selectedShift.mobile || (ageEl && ageEl.checked);

    document.getElementById('err-msg').style.display = 'none';

    if (!name)                                { showError('Please enter your name.'); return; }
    if (!email || !email.includes('@'))       { showError('Please enter a valid email address.'); return; }
    if (phone.replace(/\D/g, '').length < 10) { showError('Please enter a valid 10-digit phone number.'); return; }
    if (!waiver)                              { showError('Please acknowledge the liability waiver.'); return; }
    if (!ageOk)                               { showError('You must confirm you are 18 or older to sign up for this shift.'); return; }

    // Optimistic local update — replace with API call once backend is wired
    selectedShift.taken += 1;

    document.getElementById('modal-body').innerHTML = `
      <div class="confirm-screen">
        <div class="check">&#10003;</div>
        <h2>You're signed up!</h2>
        <p>
          <strong>${name}</strong>, we have your spot for<br>
          <strong>${selectedShift.day} &middot; ${selectedShift.time}</strong><br>
          ${selectedShift.location}<br><br>
          We'll send a reminder text to <strong>${phone}</strong> the day before your shift.<br>
          Reply <strong>CANCEL</strong> at any time if plans change.
        </p>
        <p class="proto-note">Prototype only — your details are not yet saved. Airtable integration coming.</p>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button class="signup-btn" style="flex:1;" onclick="closeModal()">Done</button>
      </div>
    `;
    render();
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  render();
</script>
</body>
</html>
